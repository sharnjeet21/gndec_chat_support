name: Promote to Production (server-prod)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for promotion (e.g. "Feature X finalized")'
        required: true
        default: 'Ready for production'

jobs:
  merge-to-prod:
    name: Merge Development to Server-Prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Pull Request and Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there are any differences
          if git diff --quiet origin/server-prod..origin/development; then
            echo "development and server-prod are already identical. Nothing to promote."
            exit 0
          fi
          
          echo "Fast-forwarding server-prod to match development..."
          git push origin origin/development:refs/heads/server-prod
          
          echo "✅ Successfully promoted development to server-prod!"

      - name: Update Production Deployment Environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checkout server-prod to read the latest README
          git checkout server-prod
          
          # Extract trycloudflare URL from README
          CF_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' README.md | head -n 1)
          
          if [ -z "$CF_URL" ]; then
            echo "No Cloudflare URL found in README.md"
            exit 0
          fi
          
          echo "Found Cloudflare URL: $CF_URL"
          
          # Create Deployment
          DEPLOY_PAYLOAD='{"ref":"server-prod","environment":"production","description":"Cloudflare Tunnel Live Agent","auto_merge":false,"production_environment":true}'
          DEPLOY_RES=$(gh api -X POST repos/${{ github.repository }}/deployments --input - <<< "$DEPLOY_PAYLOAD")
          DEPLOY_ID=$(echo "$DEPLOY_RES" | jq -r '.id')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Failed to create deployment"
            exit 1
          fi
          
          # Create Status
          STATUS_PAYLOAD='{"state":"success","environment_url":"'"$CF_URL"'","description":"Production agent is up and running"}'
          gh api -X POST repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses --input - <<< "$STATUS_PAYLOAD"
          
          echo "✅ Successfully updated GitHub Deployment Environments with URL: $CF_URL"

