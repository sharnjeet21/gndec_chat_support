name: Promote to Production (server-prod)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for promotion (e.g. "Feature X finalized")'
        required: true
        default: 'Ready for production'

jobs:
  merge-to-prod:
    name: Merge Development to Server-Prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Pull Request and Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there are any differences
          if git diff --quiet origin/server-prod..origin/development; then
            echo "development and server-prod are already identical. Nothing to promote."
            exit 0
          fi
          
          # Attempt to create a PR using GitHub CLI
          echo "Creating Pull Request from development to server-prod..."
          PR_URL=$(gh pr create \
            --base server-prod \
            --head development \
            --title "🚀 Promote to Production: ${{ github.event.inputs.reason }}" \
            --body "Automated promotion triggered by workflow dispatch." 2>/dev/null || true)

          if [ -z "$PR_URL" ]; then
            echo "PR was not created (it may already exist). Looking up existing PR..."
            PR_URL=$(gh pr list --base server-prod --head development --state open --json url --jq '.[0].url')
          fi

          if [ -z "$PR_URL" ]; then
            echo "❌ Failed to create or locate an open PR from development to server-prod."
            exit 1
          fi

          echo "Merging PR: $PR_URL"
          gh pr merge "$PR_URL" --admin --merge --subject "🚀 Promote to Production: ${{ github.event.inputs.reason }}"
          
          echo "✅ Successfully promoted development to server-prod!"
